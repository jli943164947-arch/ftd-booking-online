services:
  - type: web
    name: ftd-booking-online
    env: node
    plan: free
    buildCommand: yarn install
    startCommand: node server.js
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ftd-booking-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: ftd-booking-db
    databaseName: ftd_booking
    user: ftd_booking_user
    plan: free
